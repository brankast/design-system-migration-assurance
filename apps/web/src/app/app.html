<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="nav">
    <div class="brand">Material changelog watch</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/changes" routerLinkActive="active">
        <mat-icon matListItemIcon>history</mat-icon>
        <span matListItemTitle>Change events</span>
      </a>
      <a mat-list-item routerLink="/usages" routerLinkActive="active">
        <mat-icon matListItemIcon>code</mat-icon>
        <span matListItemTitle>Usages</span>
      </a>
      <a mat-list-item routerLink="/consumer" routerLinkActive="active">
        <mat-icon matListItemIcon>storefront</mat-icon>
        <span matListItemTitle>Consumer demo</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>Design System Migration Assurance</span>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
