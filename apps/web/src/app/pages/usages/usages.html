<section class="page">
  <h1>Affected source usages</h1>
  <p>
    Usages are found by searching the Angular app and demo consumer project for
    documented API tokens. This step does not use an LLM.
  </p>

  <table mat-table [dataSource]="assurance.usages()" class="table">
    <ng-container matColumnDef="project">
      <th mat-header-cell *matHeaderCellDef>Project</th>
      <td mat-cell *matCellDef="let row">{{ row.project }}</td>
    </ng-container>
    <ng-container matColumnDef="file">
      <th mat-header-cell *matHeaderCellDef>File</th>
      <td mat-cell *matCellDef="let row">{{ row.file }}</td>
    </ng-container>
    <ng-container matColumnDef="line">
      <th mat-header-cell *matHeaderCellDef>Line</th>
      <td mat-cell *matCellDef="let row">{{ row.line }}</td>
    </ng-container>
    <ng-container matColumnDef="api">
      <th mat-header-cell *matHeaderCellDef>Matched API</th>
      <td mat-cell *matCellDef="let row">{{ row.matchedApi }}</td>
    </ng-container>
    <ng-container matColumnDef="snippet">
      <th mat-header-cell *matHeaderCellDef>Snippet</th>
      <td mat-cell *matCellDef="let row">{{ row.codeSnippet }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</section>
